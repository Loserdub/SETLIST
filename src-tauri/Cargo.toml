[package]
name = "app"
version = "0.1.0"
description = "SETLIST - Local-first desktop application for intelligent DJ set preparation"
authors = ["SETLIST Team"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
audio-analysis = { path = "../crates/audio-analysis" }
audio-io = { path = "../crates/audio-io" }
core-types = { path = "../crates/core-types" }
exporters = { path = "../crates/exporters" }
library-db = { path = "../crates/library-db" }
log = "0.4"
playback = { path = "../crates/playback" }
rfd = "0.15"
rusqlite = { version = "0.40", features = ["bundled"] }
sequencer = { path = "../crates/sequencer" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"

[dev-dependencies]
hound = "3.5"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
