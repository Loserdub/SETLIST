[package]
name = "validate"
version = "0.1.0"
edition = "2021"

[dependencies]
audio-analysis = { path = "../../crates/audio-analysis" }
audio-io = { path = "../../crates/audio-io" }
core-types = { path = "../../crates/core-types" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[dev-dependencies]
hound = "3.5"
tempfile = "3"

[[bin]]
name = "validate"
path = "src/main.rs"
