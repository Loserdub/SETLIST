[workspace]
resolver = "2"
members = [
    "crates/core-types",
    "crates/audio-io",
    "crates/audio-analysis",
    "crates/library-db",
    "crates/sequencer",
    "crates/exporters",
    "crates/playback",
    "src-tauri",
    "tools/validate",
]

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

